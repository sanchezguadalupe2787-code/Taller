<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión - D'Juniors</title>
<style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a0c; color:#fff; font-family:'Segoe UI',Arial,sans-serif; text-align:center; padding:24px; }
    .caja { max-width:380px; }
    img { width:220px; max-width:70vw; margin-bottom:18px; }
    h1 { font-size:1.2rem; margin:0 0 8px; }
    p { color:#c9ccd2; font-size:0.92rem; line-height:1.5; }
    button { margin-top:18px; background:#ff6a1a; color:#fff; border:none; padding:10px 20px; border-radius:7px; font-size:0.95rem; cursor:pointer; }
</style>
</head>
<body>
<div class="caja">
    <img src="assets/img/logo-header.png" alt="D'Juniors">
    <h1>Sin conexión a internet</h1>
    <p>No se pudo cargar esta página porque tu dispositivo está sin conexión. Verifica tu red e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
</div>
</body>
</html>
